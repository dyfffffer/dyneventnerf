<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="900" viewBox="0 0 1800 900">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#455A64"/>
    </marker>
    <style>
      .title { font: 700 44px Arial, sans-serif; fill:#0D47A1; }
      .h1 { font: 700 30px Arial, sans-serif; fill:#37474F; }
      .txt { font: 24px Arial, sans-serif; fill:#263238; }
      .small { font: 20px Arial, sans-serif; fill:#263238; }
      .eq { font: 700 34px Arial, sans-serif; fill:#0D47A1; }
    </style>
  </defs>

  <text x="40" y="70" class="title">多时间窗口事件一致性示意图</text>

  <text x="120" y="120" class="h1">连续曝光时间轴</text>
  <line x1="120" y1="160" x2="1680" y2="160" stroke="#263238" stroke-width="5"/>

  <g>
    <line x1="120" y1="142" x2="120" y2="178" stroke="#263238" stroke-width="4"/><text x="104" y="132" class="txt">t0</text>
    <line x1="510" y1="142" x2="510" y2="178" stroke="#263238" stroke-width="4"/><text x="494" y="132" class="txt">t1</text>
    <line x1="900" y1="142" x2="900" y2="178" stroke="#263238" stroke-width="4"/><text x="884" y="132" class="txt">t2</text>
    <line x1="1290" y1="142" x2="1290" y2="178" stroke="#263238" stroke-width="4"/><text x="1274" y="132" class="txt">t3</text>
    <line x1="1680" y1="142" x2="1680" y2="178" stroke="#263238" stroke-width="4"/><text x="1664" y="132" class="txt">t4</text>
  </g>

  <rect x="120" y="230" width="390" height="90" rx="12" fill="#E3F2FD" stroke="#546E7A" stroke-width="3"/>
  <rect x="510" y="230" width="390" height="90" rx="12" fill="#E8F5E9" stroke="#546E7A" stroke-width="3"/>
  <rect x="900" y="230" width="390" height="90" rx="12" fill="#FFF3E0" stroke="#546E7A" stroke-width="3"/>
  <rect x="1290" y="230" width="390" height="90" rx="12" fill="#F3E5F5" stroke="#546E7A" stroke-width="3"/>
  <text x="180" y="285" class="txt">窗口1: [t0, t1]</text>
  <text x="570" y="285" class="txt">窗口2: [t1, t2]</text>
  <text x="960" y="285" class="txt">窗口3: [t2, t3]</text>
  <text x="1350" y="285" class="txt">窗口4: [t3, t4]</text>

  <g fill="#D1C4E9" stroke="#5E35B1" stroke-width="3">
    <rect x="40" y="380" width="160" height="100" rx="12"/><rect x="430" y="380" width="160" height="100" rx="12"/>
    <rect x="820" y="380" width="160" height="100" rx="12"/><rect x="1210" y="380" width="160" height="100" rx="12"/>
    <rect x="1600" y="380" width="160" height="100" rx="12"/>
  </g>
  <text x="70" y="440" class="small">L0 = log(I0)</text>
  <text x="460" y="440" class="small">L1 = log(I1)</text>
  <text x="850" y="440" class="small">L2 = log(I2)</text>
  <text x="1240" y="440" class="small">L3 = log(I3)</text>
  <text x="1630" y="440" class="small">L4 = log(I4)</text>

  <line x1="200" y1="430" x2="430" y2="430" stroke="#455A64" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="590" y1="430" x2="820" y2="430" stroke="#455A64" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="980" y1="430" x2="1210" y2="430" stroke="#455A64" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1370" y1="430" x2="1600" y2="430" stroke="#455A64" stroke-width="3" marker-end="url(#arrow)"/>

  <g>
    <rect x="250" y="540" width="220" height="75" rx="10" fill="#FFCDD2" stroke="#C62828" stroke-width="3"/>
    <rect x="640" y="540" width="220" height="75" rx="10" fill="#FFCDD2" stroke="#C62828" stroke-width="3"/>
    <rect x="1030" y="540" width="220" height="75" rx="10" fill="#FFCDD2" stroke="#C62828" stroke-width="3"/>
    <rect x="1420" y="540" width="220" height="75" rx="10" fill="#FFCDD2" stroke="#C62828" stroke-width="3"/>
    <text x="280" y="586" class="small" fill="#B71C1C">ΔL1 = L1 - L0</text>
    <text x="670" y="586" class="small" fill="#B71C1C">ΔL2 = L2 - L1</text>
    <text x="1060" y="586" class="small" fill="#B71C1C">ΔL3 = L3 - L2</text>
    <text x="1450" y="586" class="small" fill="#B71C1C">ΔL4 = L4 - L3</text>
  </g>

  <g>
    <rect x="260" y="655" width="200" height="70" rx="10" fill="#C8E6C9" stroke="#2E7D32" stroke-width="3"/>
    <rect x="650" y="655" width="200" height="70" rx="10" fill="#C8E6C9" stroke="#2E7D32" stroke-width="3"/>
    <rect x="1040" y="655" width="200" height="70" rx="10" fill="#C8E6C9" stroke="#2E7D32" stroke-width="3"/>
    <rect x="1430" y="655" width="200" height="70" rx="10" fill="#C8E6C9" stroke="#2E7D32" stroke-width="3"/>
    <text x="300" y="698" class="small" fill="#1B5E20">E1 (GT事件)</text>
    <text x="690" y="698" class="small" fill="#1B5E20">E2 (GT事件)</text>
    <text x="1080" y="698" class="small" fill="#1B5E20">E3 (GT事件)</text>
    <text x="1470" y="698" class="small" fill="#1B5E20">E4 (GT事件)</text>
  </g>

  <rect x="920" y="760" width="830" height="110" rx="18" fill="#E3F2FD" stroke="#1565C0" stroke-width="4"/>
  <text x="960" y="828" class="eq">L_tem = (1/K) Σ MSE(ΔL_k, E_k · Thr)</text>

  <line x1="360" y1="725" x2="970" y2="770" stroke="#90A4AE" stroke-width="2"/>
  <line x1="750" y1="725" x2="1020" y2="770" stroke="#90A4AE" stroke-width="2"/>
  <line x1="1140" y1="725" x2="1070" y2="770" stroke="#90A4AE" stroke-width="2"/>
  <line x1="1530" y1="725" x2="1120" y2="770" stroke="#90A4AE" stroke-width="2"/>

  <text x="120" y="840" class="txt">将曝光区间切成 K 个时间窗口；逐窗口约束亮度对数差分与事件观测一致，再求平均。</text>
</svg>
